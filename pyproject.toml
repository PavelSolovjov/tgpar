[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "telegram-jobs-monitor"
version = "0.1.0"
description = "MVP Telegram job-post monitor with criteria filtering and optional LLM analysis."
requires-python = ">=3.9"
dependencies = [
    "openai>=1.0.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.0",
    "telethon>=1.36.0",
]

[project.scripts]
tg-jobs-monitor = "tg_jobs_monitor.main:main"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.setuptools.packages.find]
where = ["src"]
