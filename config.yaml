# The target channel where matching vacancies will be posted.
# The bot must be an admin there.
destination_channel: "@vakansiiprojectov"

criteria:
  require_domains: false
  require_levels: false
  roles:
    - "project manager"
    - "delivery manager"
    - "launch manager"
    - "implementation manager"
    - "руководитель проектов"
    - "менеджер проектов"
    - "деливери менеджер"
    - "pm"
    - "project lead"
    - "program manager"
    - "delivery lead"
    - "technical project manager"
    - "it project manager"
  domains: []
  levels: []

llm:
  enabled: true
  temperature: 0
  max_input_chars: 6000

hh:
  enabled: false
  per_page: 20
  pages: 1
  request_delay_seconds: 0.5
  min_salary_rur: 250000
  require_remote: true
  allowed_domain_keywords:
    - "crypto"
    - "web3"
    - "fintech"
    - "payments"
    - "payment"
    - "blockchain"
    - "mobile"
    - "ios"
    - "android"
    - "flutter"
    - "react native"
    - "мобильн"
  excluded_grade_terms:
    - "junior"
    - "джуниор"
    - "intern"
    - "стажер"
    - "стажировка"
  excluded_company_keywords:
    - "заказная разработка"
    - "разработка на заказ"
    - "аутсорс"
    - "аутстафф"
    - "outsource"
    - "outsource company"
    - "outstaff"
    - "digital agency"
    - "software development company"
    - "студия разработки"
    - "agency"
  searches:
    - source: "hh-project-manager"
      text: "project manager"
      area: 113
    - source: "hh-delivery-manager"
      text: "delivery manager"
      area: 113
    - source: "hh-launch-manager"
      text: "launch manager"
      area: 113
    - source: "hh-ru-pm"
      text: "менеджер проектов"
      area: 113
    - source: "hh-ru-head-pm"
      text: "руководитель проектов"
      area: 113
