poll_interval_seconds: 60
recent_messages_limit: 50
publish_on_first_run: false
dry_run: false

# Public Telegram channel usernames. The scraper reads https://t.me/s/<channel>.
source_channels:
  - "@opento_crypto"
  - "@cryptoheadhunter"
  - "@workingincrypto"

# The target channel where matching vacancies will be posted.
# The bot must be an admin there.
destination_channel: "@your_target_channel"

criteria:
  roles:
    - "project manager"
    - "delivery manager"
    - "руководитель проектов"
    - "менеджер проектов"
    - "деливери менеджер"
  domains:
    - "fintech"
    - "crypto"
    - "web3"
    - "payments"
    - "blockchain"
    - "финтех"
    - "крипто"
    - "платежи"
    - "блокчейн"
  levels:
    - "middle"
    - "senior"
    - "мидл"
    - "сеньор"

llm:
  enabled: true
  temperature: 0
  max_input_chars: 6000
